<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#090806">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://ovwfqbcxsdfddnfdgopg.supabase.co; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">
  <title>SOXLO Password Change</title>
  <link rel="stylesheet" href="messenger.css?v=3">
</head>
<body>
  <main class="shell">
    <section class="login-card">
      <div class="brand"><span>SOXLO</span><small>ACCOUNT SECURITY</small></div>
      <h1>Change VIP Password</h1>
      <p id="accountHint" class="muted">Checking your secure Messenger session…</p>

      <div id="needsLogin" hidden>
        <p class="security-note"><strong>Messenger sign-in required</strong><span>Open Messenger in this same browser tab, sign in, then use your browser Back button to return here.</span></p>
        <a class="gold-btn" href="messenger.html">Open SOXLO Messenger</a>
      </div>

      <form id="changePasswordForm" class="stack" hidden>
        <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label>
        <label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
        <button class="gold-btn" type="submit">Save New VIP Password</button>
      </form>
      <p id="message" class="message" aria-live="polite"></p>
      <p><a class="text-btn" href="members.html">Go to VIP Login</a></p>
    </section>
  </main>
  <script src="change-vip-password.js?v=1" defer></script>
</body>
</html>
