plugins { id 'com.android.application' }

def signingStoreFile = System.getenv('SOXLO_ANDROID_KEYSTORE_PATH')
def signingStorePassword = System.getenv('SOXLO_ANDROID_STORE_PASSWORD')
def signingKeyAlias = System.getenv('SOXLO_ANDROID_KEY_ALIAS')
def signingKeyPassword = System.getenv('SOXLO_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'com.soxlo.messenger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soxlo.messenger'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'packageRelease' && !hasReleaseSigning) {
        task.doFirst {
            throw new GradleException('SOXLO Messenger release signing secrets are missing. Configure the protected GitHub Actions secrets before building a release APK.')
        }
    }
}
