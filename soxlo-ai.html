<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOXLO AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#251b08,#070707 55%);color:#f5e6b5;font-family:Arial,sans-serif;min-height:100vh}.top{padding:24px;border-bottom:1px solid #8c6a24;text-align:center}.brand{font-size:34px;letter-spacing:7px;font-weight:800;background:linear-gradient(#fff0a3,#d9a83d,#8e5e12);-webkit-background-clip:text;color:transparent}.sub{font-size:12px;letter-spacing:5px;color:#c99a38;margin-top:7px}.wrap{max-width:850px;margin:auto;padding:30px 18px}.card{border:1px solid #806020;border-radius:22px;background:#11100dcc;box-shadow:0 0 35px #c9972730;overflow:hidden}.head{padding:22px;border-bottom:1px solid #4f3c18}.head h1{margin:0 0 8px;color:#e7bd59}.chat{height:48vh;min-height:330px;overflow:auto;padding:20px}.msg{padding:13px 15px;border-radius:15px;margin:10px 0;max-width:88%;line-height:1.45}.ai{background:#201a0d;border:1px solid #5d461b}.me{background:linear-gradient(135deg,#8b651c,#c49535);color:#090909;margin-left:auto}.bar{display:flex;gap:10px;padding:15px;border-top:1px solid #4f3c18}.bar textarea{flex:1;resize:none;border-radius:14px;padding:13px;background:#090909;color:#fff;border:1px solid #74571e;min-height:52px}.bar button{border:0;border-radius:14px;padding:0 22px;font-weight:bold;background:linear-gradient(#e2b84f,#9b6c18);cursor:pointer}.note{text-align:center;color:#9c8c66;font-size:12px;margin-top:15px}.back{color:#d7ad54;text-decoration:none}
</style>
</head><body>
<div class="top"><div class="brand">SOXLO</div><div class="sub">AI LAB</div></div>
<div class="wrap"><p><a class="back" href="index.html">← SOXLO Production</a></p><div class="card"><div class="head"><h1>SOXLO AI</h1><div>Your private AI workspace — starter edition</div></div><div id="chat" class="chat"><div class="msg ai">SOXLO AI interface is installed. The website part is free. The next step is connecting a free/open-source model.</div></div><div class="bar"><textarea id="prompt" placeholder="Ask SOXLO AI..."></textarea><button id="send">SEND</button></div></div><div class="note">No paid API key is installed. Your existing SOXLO pages are unchanged.</div></div>
<script>
const p=document.getElementById('prompt'),c=document.getElementById('chat');document.getElementById('send').onclick=()=>{let t=p.value.trim();if(!t)return;c.insertAdjacentHTML('beforeend','<div class="msg me"></div>');c.lastElementChild.textContent=t;p.value='';setTimeout(()=>{let d=document.createElement('div');d.className='msg ai';d.textContent='The SOXLO AI page is ready, but no AI model is connected yet. This prevents surprise API charges.';c.appendChild(d);c.scrollTop=c.scrollHeight},250);c.scrollTop=c.scrollHeight};p.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('send').click()}});
</script></body></html>
