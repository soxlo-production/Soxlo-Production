name: Build SOXLO Messenger APK

on:
  push:
    paths:
      - 'android-messenger/**'
      - '.github/workflows/build-messenger-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore release keystore
        env:
          KEYSTORE_DATA: ${{ secrets.SOXLO_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_DATA" || { echo 'Release keystore secret is not configured'; exit 1; }
          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$RUNNER_TEMP/soxlo-release.jks"
          chmod 600 "$RUNNER_TEMP/soxlo-release.jks"

      - name: Build release APK
        working-directory: android-messenger
        env:
          SOXLO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/soxlo-release.jks
          SOXLO_ANDROID_STORE_PASSWORD: ${{ secrets.SOXLO_ANDROID_STORE_PASSWORD }}
          SOXLO_ANDROID_KEY_ALIAS: ${{ secrets.SOXLO_ANDROID_KEY_ALIAS }}
          SOXLO_ANDROID_KEY_PASSWORD: ${{ secrets.SOXLO_ANDROID_KEY_PASSWORD }}
        run: gradle clean assembleRelease

      - name: Prepare APK
        run: cp android-messenger/app/build/outputs/apk/release/app-release.apk SOXLO-Messenger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SOXLO-Messenger-Release-APK
          path: SOXLO-Messenger.apk
