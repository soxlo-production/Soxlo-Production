name: Build SOXLO Messenger APK

on:
  push:
    paths:
      - 'android-messenger/**'
      - '.github/workflows/build-messenger-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android-messenger
        run: gradle assembleDebug
      - name: Prepare APK
        run: cp android-messenger/app/build/outputs/apk/debug/app-debug.apk SOXLO-Messenger.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SOXLO-Messenger-APK
          path: SOXLO-Messenger.apk
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view soxlo-messenger-latest >/dev/null 2>&1 || gh release create soxlo-messenger-latest --title 'SOXLO Messenger Android App' --notes 'Latest installable SOXLO Messenger Android APK.' --target "$GITHUB_SHA"
          gh release upload soxlo-messenger-latest SOXLO-Messenger.apk --clobber
