name: Build SOXLO VIP APK

on:
  push:
    paths:
      - 'android-vip/**'
      - '.github/workflows/build-vip-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android-vip
        run: gradle assembleDebug
      - name: Prepare APK
        run: cp android-vip/app/build/outputs/apk/debug/app-debug.apk SOXLO-VIP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SOXLO-VIP-APK
          path: SOXLO-VIP.apk
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view soxlo-vip-latest >/dev/null 2>&1 || gh release create soxlo-vip-latest --title 'SOXLO VIP Android App' --notes 'Latest installable SOXLO VIP Android APK.' --target "$GITHUB_SHA"
          gh release upload soxlo-vip-latest SOXLO-VIP.apk --clobber
