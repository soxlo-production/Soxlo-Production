<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>SOXLO Messenger Reset</title><style>html,body{margin:0;min-height:100%;background:#0b0d10;color:#f5f2e8;font-family:Arial,sans-serif}body{display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:28px}.gold{color:#d4af37;font-weight:800;font-size:28px}.small{margin-top:10px;color:#aaa}</style></head><body><div class="box"><div class="gold">SOXLO Messenger</div><div class="small">Refreshing Messenger…</div></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}}catch(e){}location.replace('./messenger.html?clean='+Date.now())})();</script></body></html>
