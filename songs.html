<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><meta name="description" content="SOXLO Songs — private generated music library."><title>SOXLO Songs</title><link rel="icon" href="soxlo-app-icon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><style>:root{--g:#d9b45a;--g2:#f2da87;--line:#544018;--text:#f7f4ec;--muted:#9e998f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#2b210f 0,transparent 25%),linear-gradient(#080808,#040404);color:var(--text);font-family:Inter,Arial,sans-serif}.top{min-height:102px;padding:22px clamp(18px,4vw,52px);display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);background:#090909ed;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{text-decoration:none;display:flex;flex-direction:column;line-height:1}.brand strong{font-size:clamp(28px,5vw,47px);letter-spacing:8px;background:linear-gradient(180deg,#fff1a3,#e1b14a,#986614);-webkit-background-clip:text;background-clip:text;color:transparent}.brand span{margin-top:7px;color:#e1b653;font-size:12px;letter-spacing:5px}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{text-decoration:none;color:#f3dda0;border:1px solid var(--g);background:#15110a;padding:11px 14px;font-size:12px;font-weight:800}.wrap{width:min(1180px,94vw);margin:auto;padding:42px 0 70px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--g);font-weight:800}.head h1{font-family:'Playfair Display',serif;font-size:clamp(42px,7vw,72px);margin:5px 0 7px;line-height:1}.head p{margin:0;color:var(--muted);line-height:1.6}.count{color:#d3c49a;font-size:12px;border:1px solid #3e321b;border-radius:999px;padding:9px 12px;background:#0d0c09}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.song{display:grid;grid-template-columns:150px 1fr;gap:18px;border:1px solid #3d321c;border-radius:18px;padding:16px;background:linear-gradient(145deg,#13110c,#0c0c0c);box-shadow:0 18px 45px #0007}.cover{width:150px;aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f0d77b44,transparent 25%),linear-gradient(135deg,#7d5515,#17120a 58%,#0a0a0a);border:1px solid #624917;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.cover .s{font:800 62px Inter;color:#f5dda0;text-shadow:0 0 22px #d9b45a66}.copy h2{font-size:19px;margin:4px 0 5px}.meta{color:#9d978b;font-size:11px;line-height:1.5}.tag{display:inline-block;color:#f0d77d;border:1px solid #59451e;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;letter-spacing:.7px;margin-bottom:6px}.player{width:100%;margin:13px 0 10px}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button,.actions a{border:1px solid #6b501d;background:#15110a;color:#f5dda1;padding:9px 10px;border-radius:9px;font-size:10px;font-weight:800;text-decoration:none;cursor:pointer}.actions .primary{background:linear-gradient(135deg,#765015,#c69637,#765015);border-color:#f0d77d;color:#fff4c5}.details{margin-top:10px}.details summary{cursor:pointer;color:#c9b77f;font-size:10px;font-weight:800}.detailbody{margin-top:8px;padding:10px;border:1px solid #2f291b;border-radius:9px;background:#090909;color:#8e897f;font-size:10px;line-height:1.6;white-space:pre-wrap}.empty{grid-column:1/-1;padding:56px 24px;text-align:center;border:1px dashed #55421d;border-radius:20px;background:#0d0c09}.empty strong{display:block;color:#f1da89;font-size:22px;margin-bottom:8px}.empty p{color:#8e897f;max-width:600px;margin:0 auto 20px;line-height:1.6}.empty a{display:inline-block;text-decoration:none;border:1px solid #f0d77d;background:linear-gradient(135deg,#765015,#c69637,#765015);color:#fff4c5;padding:13px 16px;border-radius:10px;font-size:12px;font-weight:800}.danger{color:#bfae83!important}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.song{grid-template-columns:95px 1fr}.cover{width:95px}.cover .s{font-size:42px}.top{align-items:flex-start}.brand strong{letter-spacing:5px}.brand span{letter-spacing:3px}.head{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><a class="brand" href="studio.html"><strong>SOXLO</strong><span>SONGS</span></a><nav class="nav"><a href="studio.html">← STUDIO</a><a href="video-studio.html">VIDEO STUDIO</a><a href="index.html">MAIN WEBSITE</a></nav></header><main class="wrap"><section class="head"><div><div class="eyebrow">SOXLO PRODUCTION</div><h1>My Songs</h1><p>Your finished SOXLO generations collected in one private creation library.</p></div><div class="count" id="count">0 SONGS</div></section><section class="grid" id="grid"></section></main><script>const LIBKEY='soxlo_generated_songs_v1',VIDEO_KEY='soxlo_video_selected_song_v1';const grid=document.getElementById('grid'),count=document.getElementById('count');function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function songs(){try{return JSON.parse(localStorage.getItem(LIBKEY)||'[]')}catch{return[]}}function save(list){localStorage.setItem(LIBKEY,JSON.stringify(list))}function fmtDate(v){try{return new Date(v).toLocaleString()}catch{return''}}function render(){const list=songs();count.textContent=`${list.length} SONG${list.length===1?'':'S'}`;if(!list.length){grid.innerHTML='<div class="empty"><strong>No generated songs yet.</strong><p>When a finished master comes back from SOXLO Production Studio, it will automatically appear here with its player, credits, download and Video Studio shortcut.</p><a href="studio.html">CREATE A SONG →</a></div>';return}grid.innerHTML=list.map(s=>`<article class="song" data-id="${esc(s.id)}"><div class="cover">${s.coverUrl?`<img src="${esc(s.coverUrl)}" alt="">`:'<span class="s">S</span>'}</div><div class="copy"><span class="tag">SOXLO FINISHED MASTER</span><h2>${esc(s.title||'Untitled Song')}</h2><div class="meta">${esc(s.artist||'SOXLO Production')} · ${esc(fmtDate(s.createdAt))}</div>${s.audioUrl?`<audio class="player" controls preload="metadata" src="${esc(s.audioUrl)}"></audio>`:'<div class="meta" style="margin:13px 0">Audio will appear here when the generation engine returns the finished master.</div>'}<div class="actions">${s.audioUrl?`<a class="primary" href="${esc(s.audioUrl)}" download>DOWNLOAD ↓</a>`:''}<button class="primary" data-video="${esc(s.id)}">OPEN IN VIDEO STUDIO →</button><button class="danger" data-delete="${esc(s.id)}">DELETE</button></div><details class="details"><summary>PROJECT DETAILS</summary><div class="detailbody">STYLE\n${esc(s.style||'—')}\n\nCREDITS\nProducer: ${esc(s.credits?.producer||'—')}\nSongwriter: ${esc(s.credits?.songwriter||'—')}\nComposer: ${esc(s.credits?.composer||'—')}\nLabel: ${esc(s.credits?.label||'—')}\n\nLYRICS\n${esc(s.lyrics||'—')}</div></details></div></article>`).join('');grid.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this song from SOXLO Songs?'))return;save(songs().filter(s=>String(s.id)!==String(b.dataset.delete)));render()});grid.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>{const s=songs().find(x=>String(x.id)===String(b.dataset.video));if(!s)return;localStorage.setItem(VIDEO_KEY,JSON.stringify(s));location.href='video-studio.html?from=songs'})}render();window.addEventListener('storage',render);</script></body></html>
