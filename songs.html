<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><meta name="description" content="SOXLO Songs — private generated music library."><title>SOXLO Songs</title><link rel="icon" href="soxlo-app-icon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><style>
:root{--g:#d9b45a;--g2:#f2da87;--line:#544018;--text:#f7f4ec;--muted:#9e998f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#2b210f 0,transparent 25%),linear-gradient(#080808,#040404);color:var(--text);font-family:Inter,Arial,sans-serif}.top{min-height:102px;padding:22px clamp(18px,4vw,52px);display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);background:#090909ed;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{text-decoration:none;display:flex;flex-direction:column;line-height:1}.brand strong{font-size:clamp(28px,5vw,47px);letter-spacing:8px;background:linear-gradient(180deg,#fff1a3,#e1b14a,#986614);-webkit-background-clip:text;background-clip:text;color:transparent}.brand span{margin-top:7px;color:#e1b653;font-size:12px;letter-spacing:5px}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{text-decoration:none;color:#f3dda0;border:1px solid var(--g);background:#15110a;padding:11px 14px;font-size:12px;font-weight:800}.wrap{width:min(1180px,94vw);margin:auto;padding:42px 0 70px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--g);font-weight:800}.head h1{font-family:'Playfair Display',serif;font-size:clamp(42px,7vw,72px);margin:5px 0 7px;line-height:1}.head p{margin:0;color:var(--muted);line-height:1.6}.count{color:#d3c49a;font-size:12px;border:1px solid #3e321b;border-radius:999px;padding:9px 12px;background:#0d0c09}.notice{display:none;margin:0 0 20px;padding:14px 16px;border:1px solid #5d461c;border-left:4px solid var(--g);border-radius:12px;background:#17130b;color:#d7c99f;font-size:12px;line-height:1.6}.notice.show{display:block}.notice.error{border-color:#71402f;border-left-color:#d67d57;color:#e6b8a4}.notice button,.notice a{margin-top:10px;margin-right:8px;display:inline-block;border:1px solid #846325;background:#17120a;color:#f2d98b;padding:9px 11px;border-radius:9px;text-decoration:none;font-weight:800;font-size:10px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.song{display:grid;grid-template-columns:150px 1fr;gap:18px;border:1px solid #3d321c;border-radius:18px;padding:16px;background:linear-gradient(145deg,#13110c,#0c0c0c);box-shadow:0 18px 45px #0007}.song.pending{border-color:#735821;background:radial-gradient(circle at 20% 20%,#d9b45a18,transparent 30%),linear-gradient(145deg,#15120b,#0c0c0c)}.cover{width:150px;aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f0d77b44,transparent 25%),linear-gradient(135deg,#7d5515,#17120a 58%,#0a0a0a);border:1px solid #624917;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.cover .s{font:800 62px Inter;color:#f5dda0;text-shadow:0 0 22px #d9b45a66}.spinner{width:54px;height:54px;border-radius:50%;border:4px solid #5b451f;border-top-color:#f0d77d;animation:spin 1s linear infinite;box-shadow:0 0 28px #d9b45a33}@keyframes spin{to{transform:rotate(360deg)}}.copy h2{font-size:19px;margin:4px 0 5px}.meta{color:#9d978b;font-size:11px;line-height:1.5}.tag{display:inline-block;color:#f0d77d;border:1px solid #59451e;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;letter-spacing:.7px;margin-bottom:6px}.player{width:100%;margin:13px 0 10px}.progress{height:7px;background:#241c0d;border-radius:999px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;width:45%;background:linear-gradient(90deg,#805717,#e3b34c,#805717);animation:move 1.5s ease-in-out infinite alternate}@keyframes move{from{transform:translateX(-50%)}to{transform:translateX(170%)}}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button,.actions a{border:1px solid #6b501d;background:#15110a;color:#f5dda1;padding:9px 10px;border-radius:9px;font-size:10px;font-weight:800;text-decoration:none;cursor:pointer}.actions .primary{background:linear-gradient(135deg,#765015,#c69637,#765015);border-color:#f0d77d;color:#fff4c5}.details{margin-top:10px}.details summary{cursor:pointer;color:#c9b77f;font-size:10px;font-weight:800}.detailbody{margin-top:8px;padding:10px;border:1px solid #2f291b;border-radius:9px;background:#090909;color:#8e897f;font-size:10px;line-height:1.6;white-space:pre-wrap}.empty{grid-column:1/-1;padding:56px 24px;text-align:center;border:1px dashed #55421d;border-radius:20px;background:#0d0c09}.empty strong{display:block;color:#f1da89;font-size:22px;margin-bottom:8px}.empty p{color:#8e897f;max-width:600px;margin:0 auto 20px;line-height:1.6}.empty a{display:inline-block;text-decoration:none;border:1px solid #f0d77d;background:linear-gradient(135deg,#765015,#c69637,#765015);color:#fff4c5;padding:13px 16px;border-radius:10px;font-size:12px;font-weight:800}.danger{color:#bfae83!important}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.song{grid-template-columns:95px 1fr}.cover{width:95px}.cover .s{font-size:42px}.top{align-items:flex-start}.brand strong{letter-spacing:5px}.brand span{letter-spacing:3px}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><a class="brand" href="studio.html"><strong>SOXLO</strong><span>SONGS</span></a><nav class="nav"><a href="studio.html">← STUDIO</a><a href="video-studio.html">VIDEO STUDIO</a><a href="index.html">MAIN WEBSITE</a></nav></header><main class="wrap"><section class="head"><div><div class="eyebrow">SOXLO PRODUCTION</div><h1>My Songs</h1><p>Every creation produces two closely related song versions from the same musical plan.</p></div><div class="count" id="count">0 SONGS</div></section><div class="notice" id="notice"></div><section class="grid" id="grid"></section></main>
<script>
const LIBKEY='soxlo_generated_songs_v1',PENDING='soxlo_pending_generation_v1',SESSION_KEY='soxlo_private_session_v1',VIDEO_KEY='soxlo_video_selected_song_v1';
const grid=document.getElementById('grid'),count=document.getElementById('count'),notice=document.getElementById('notice');let cfg=null,activePending=null,remoteSongs=[];
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function localSongs(){try{return JSON.parse(localStorage.getItem(LIBKEY)||'[]')}catch{return[]}}function saveLocal(list){localStorage.setItem(LIBKEY,JSON.stringify(list.slice(0,300)))}function fmtDate(v){try{return new Date(v).toLocaleString()}catch{return''}}function showNotice(text,type='',buttons=''){notice.className='notice show'+(type?` ${type}`:'');notice.innerHTML=`${text}${buttons}`}function hideNotice(){notice.className='notice';notice.innerHTML=''}
async function loadConfig(){cfg=await fetch('supabase-config.json',{cache:'no-store'}).then(r=>r.json())}
function session(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}function saveSession(s){localStorage.setItem(SESSION_KEY,JSON.stringify(s))}function expired(s){return !!s?.expires_at&&Date.now()/1000>Number(s.expires_at)-45}
async function refreshSession(s){if(!s?.refresh_token)throw new Error('Sign in to SOXLO before generating songs.');const r=await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:cfg.anonKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error('Your SOXLO session expired. Sign in again.');d.expires_at=Math.floor(Date.now()/1000)+Number(d.expires_in||3600);saveSession(d);return d}
async function currentSession(){let s=session();if(s&&expired(s))s=await refreshSession(s);return s}
async function signPath(path,s){const r=await fetch(`${cfg.url}/storage/v1/object/sign/generated-songs/${String(path).split('/').map(encodeURIComponent).join('/')}`,{method:'POST',headers:{apikey:cfg.anonKey,Authorization:`Bearer ${s.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:86400})});const d=await r.json().catch(()=>({}));if(!r.ok)return'';let u=d.signedURL||d.signedUrl||'';if(u&&!/^https?:\/\//i.test(u))u=`${cfg.url}${u.startsWith('/storage/')?'':'/storage/v1'}${u.startsWith('/')?u:`/${u}`}`;return u}
function pendingCards(job){return [1,2].map(v=>`<article class="song pending"><div class="cover"><div class="spinner"></div></div><div class="copy"><span class="tag">CREATING VERSION ${v}</span><h2>${esc(job.title||'Untitled Song')} — Version ${v}</h2><div class="meta">SOXLO Production · generating from the same composition plan</div><div class="progress"><span></span></div><div class="meta">Writing arrangement, rendering audio, applying professional finish and saving the master…</div></div></article>`).join('')}
function render(){const local=localSongs(),seen=new Set(),list=[...remoteSongs,...local].filter(s=>{const k=String(s.id||s.storagePath||s.title);if(seen.has(k))return false;seen.add(k);return true});count.textContent=`${list.length+(activePending?2:0)} SONG${list.length+(activePending?2:0)===1?'':'S'}`;let html=activePending?pendingCards(activePending):'';if(!list.length&&!activePending){html='<div class="empty"><strong>No generated songs yet.</strong><p>Create a song in SOXLO Production Studio. One press will bring you here and create two similar versions automatically.</p><a href="studio.html">CREATE A SONG →</a></div>'}else html+=list.map(s=>`<article class="song" data-id="${esc(s.id)}"><div class="cover">${s.coverUrl?`<img src="${esc(s.coverUrl)}" alt="">`:'<span class="s">S</span>'}</div><div class="copy"><span class="tag">SOXLO FINISHED MASTER${s.variant?` · VERSION ${esc(s.variant)}`:''}</span><h2>${esc(s.title||'Untitled Song')}</h2><div class="meta">${esc(s.artist||'SOXLO Production')} · ${esc(fmtDate(s.createdAt||s.created_at))}</div>${s.audioUrl?`<audio class="player" controls preload="metadata" src="${esc(s.audioUrl)}"></audio>`:'<div class="meta" style="margin:13px 0">Preparing secure audio link…</div>'}<div class="actions">${s.audioUrl?`<a class="primary" href="${esc(s.audioUrl)}" download>DOWNLOAD ↓</a>`:''}<button class="primary" data-video="${esc(s.id)}">OPEN IN VIDEO STUDIO →</button><button class="danger" data-delete="${esc(s.id)}">DELETE</button></div><details class="details"><summary>PROJECT DETAILS</summary><div class="detailbody">STYLE\n${esc(s.style||'—')}\n\nCREDITS\nProducer: ${esc(s.credits?.producer||'—')}\nSongwriter: ${esc(s.credits?.songwriter||'—')}\nComposer: ${esc(s.credits?.composer||'—')}\nLabel: ${esc(s.credits?.label||'—')}\n\nLYRICS\n${esc(s.lyrics||'—')}</div></details></div></article>`).join('');grid.innerHTML=html;grid.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>{const all=[...remoteSongs,...localSongs()],s=all.find(x=>String(x.id)===String(b.dataset.video));if(!s)return;localStorage.setItem(VIDEO_KEY,JSON.stringify(s));location.href='video-studio.html?from=songs'});grid.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteSong(b.dataset.delete))}
async function loadRemote(){try{const s=await currentSession();if(!s)return;const r=await fetch(`${cfg.url}/rest/v1/generated_songs?select=id,title,storage_path,style,lyrics,credits,created_at,variant,batch_id&order=created_at.desc`,{headers:{apikey:cfg.anonKey,Authorization:`Bearer ${s.access_token}`}});if(!r.ok)return;const rows=await r.json();remoteSongs=await Promise.all(rows.map(async x=>({id:x.id,title:x.title,artist:'SOXLO Production',storagePath:x.storage_path,style:x.style,lyrics:x.lyrics,credits:x.credits,createdAt:x.created_at,variant:x.variant,batchId:x.batch_id,audioUrl:await signPath(x.storage_path,s)})));render()}catch{}}
async function deleteSong(id){const local=localSongs(),item=[...remoteSongs,...local].find(x=>String(x.id)===String(id));if(!item||!confirm('Delete this song from SOXLO Songs?'))return;try{const s=await currentSession();if(s&&item.storagePath){await fetch(`${cfg.url}/storage/v1/object/generated-songs/${String(item.storagePath).split('/').map(encodeURIComponent).join('/')}`,{method:'DELETE',headers:{apikey:cfg.anonKey,Authorization:`Bearer ${s.access_token}`}});await fetch(`${cfg.url}/rest/v1/generated_songs?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',headers:{apikey:cfg.anonKey,Authorization:`Bearer ${s.access_token}`}})}}catch{}saveLocal(local.filter(x=>String(x.id)!==String(id)));remoteSongs=remoteSongs.filter(x=>String(x.id)!==String(id));render()}
async function runPending(){let job;try{job=JSON.parse(localStorage.getItem(PENDING)||'null')}catch{job=null}if(!job)return;activePending=job;render();showNotice('Creating two SOXLO versions from one composition plan. You can stay on this page while both masters are generated.');try{const s=await currentSession();if(!s)throw new Error('Sign in to SOXLO before generating songs.');const r=await fetch(`${cfg.url}/functions/v1/studio-music-generator`,{method:'POST',headers:{apikey:cfg.anonKey,Authorization:`Bearer ${s.access_token}`,'Content-Type':'application/json'},body:JSON.stringify(job)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Song generation failed.');const returned=Array.isArray(d.songs)?d.songs:[];const local=localSongs(),ids=new Set(local.map(x=>String(x.id)));returned.reverse().forEach(song=>{if(!ids.has(String(song.id)))local.unshift(song)});saveLocal(local);localStorage.removeItem(PENDING);activePending=null;showNotice('Version 1 and Version 2 are finished and saved to SOXLO Songs.');await loadRemote();render()}catch(e){activePending=null;render();const msg=esc(e?.message||String(e));showNotice(`${msg}<br>SOXLO kept this creation request so you can retry it without making a new pair.`,'error',`<button id="retryBtn">RETRY THIS PAIR</button><a href="members.html">SIGN IN</a>`);document.getElementById('retryBtn')?.addEventListener('click',()=>{hideNotice();runPending()})}}
(async()=>{try{await loadConfig();render();await loadRemote();await runPending()}catch(e){showNotice(esc(e?.message||String(e)),'error');render()}})();
</script></body></html>
